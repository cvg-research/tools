<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Pixel Art Canvas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            height: 100vh;
            display: flex;
            position: relative;
        }

        .canvas-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            overflow: auto;
        }

        .canvas-container {
            background: #F5F5F0;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        #drawingCanvas {
            display: block;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            cursor: crosshair;
            touch-action: none;
        }

        /* Side Panel */
        .controls-panel {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 280px;
            background: rgba(255, 255, 255, 0.98);
            box-shadow: 4px 0 20px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
            z-index: 100;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .controls-panel.hidden {
            transform: translateX(-100%);
        }

        .controls-header {
            position: sticky;
            top: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .controls-header h2 {
            font-size: 15px;
            font-weight: 600;
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .controls-content {
            padding: 12px;
        }

        .control-section {
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid #e0e0e0;
        }

        .control-section:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }

        .control-section h3 {
            font-size: 11px;
            font-weight: 600;
            color: #666;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .size-controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .size-control {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .size-control label {
            min-width: 45px;
            font-size: 12px;
            font-weight: 500;
        }

        .size-control input[type="range"] {
            flex: 1;
            height: 5px;
            border-radius: 3px;
            background: #e0e0e0;
            outline: none;
            -webkit-appearance: none;
        }

        .size-control input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
        }

        .size-control input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            border: none;
        }

        .size-control .value {
            min-width: 32px;
            text-align: right;
            font-weight: 600;
            color: #667eea;
            font-size: 12px;
        }

        .checkbox-control {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
            padding: 6px;
            border-radius: 6px;
            transition: background 0.2s;
            font-size: 12px;
        }

        .checkbox-control:hover {
            background: #f8f8f8;
        }

        .checkbox-control input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .color-palette {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .color-swatch {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
            position: relative;
        }

        .color-swatch:hover {
            transform: scale(1.1);
        }

        .color-swatch.selected {
            border-color: #333;
            transform: scale(1.15);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .color-swatch.selected::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 16px;
            color: white;
            text-shadow: 0 0 4px rgba(0, 0, 0, 0.8);
        }

        .current-color {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            background: #f8f8f8;
            border-radius: 6px;
            margin-bottom: 10px;
        }

        .current-color-box {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            border: 2px solid #333;
            flex-shrink: 0;
        }

        .current-color span {
            font-size: 12px;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        button {
            padding: 10px 16px;
            font-size: 12px;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        button.primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
        }

        button.primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        button.secondary {
            background: #f0f0f0;
            color: #333;
        }

        button.secondary:hover {
            background: #e0e0e0;
        }

        button.danger {
            background: #f44336;
            color: white;
        }

        button.danger:hover {
            background: #d32f2f;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        button:active:not(:disabled) {
            transform: scale(0.98);
        }

        /* Floating Toggle Button */
        .floating-toggle {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
            z-index: 99;
            transition: all 0.3s ease;
        }

        .floating-toggle:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }

        .floating-toggle:active {
            transform: scale(0.95);
        }

        .floating-toggle.hidden {
            transform: translateX(-80px);
            opacity: 0;
        }

        .hidden {
            display: none !important;
        }

        .export-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .export-modal-content {
            background: white;
            border-radius: 12px;
            padding: 24px;
            max-width: 360px;
            width: 100%;
        }

        .export-modal-content h2 {
            margin-bottom: 12px;
            font-size: 18px;
        }

        .export-modal-content p {
            margin-bottom: 16px;
            color: #666;
            font-size: 13px;
        }

        .share-notice {
            margin-top: 12px;
            padding: 10px;
            background: #e8f5e9;
            border-radius: 6px;
            font-size: 12px;
            color: #2e7d32;
            text-align: center;
        }

        @media (min-width: 768px) {
            .controls-panel {
                width: 320px;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <button class="floating-toggle" id="floatingToggle">☰</button>

        <div class="controls-panel" id="controlsPanel">
            <div class="controls-header">
                <h2>Controls</h2>
                <button class="close-btn" id="closeBtn">✕</button>
            </div>
            <div class="controls-content">
                <div class="control-section" id="sizeSection">
                    <h3>Canvas Size</h3>
                    <div class="size-controls">
                        <div class="size-control">
                            <label>Width:</label>
                            <input type="range" id="widthSlider" min="0" max="4" value="2" step="1">
                            <span class="value" id="widthValue">24</span>
                        </div>
                        <div class="size-control">
                            <label>Height:</label>
                            <input type="range" id="heightSlider" min="0" max="4" value="2" step="1">
                            <span class="value" id="heightValue">24</span>
                        </div>
                        <label class="checkbox-control">
                            <input type="checkbox" id="aspectLock" checked>
                            <span>Lock Aspect Ratio</span>
                        </label>
                        <label class="checkbox-control">
                            <input type="checkbox" id="gridToggle" checked>
                            <span>Show Grid</span>
                        </label>
                    </div>
                </div>

                <div class="control-section" id="colorSection">
                    <h3>Color</h3>
                    <div class="current-color">
                        <div class="current-color-box" id="currentColorBox"></div>
                        <span>Current</span>
                    </div>
                    <div class="color-palette" id="colorPalette"></div>
                </div>

                <div class="control-section" id="actionsSection">
                    <h3>Actions</h3>
                    <div class="button-group">
                        <button class="danger" id="clearBtn">Clear</button>
                        <button class="primary" id="convertBtn">Convert</button>
                    </div>
                </div>

                <div class="control-section hidden" id="previewActions">
                    <h3>Preview</h3>
                    <div class="button-group">
                        <button class="secondary" id="backBtn">Edit</button>
                        <button class="primary" id="exportBtn">Export</button>
                    </div>
                    <div style="margin-top: 8px;">
                        <button class="secondary" id="shareBtn" style="width: 100%;">Share</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="canvas-wrapper">
            <div class="canvas-container">
                <canvas id="drawingCanvas"></canvas>
            </div>
        </div>
    </div>

    <div id="exportModal" class="export-modal hidden">
        <div class="export-modal-content">
            <h2>Export Pixel Art</h2>
            <p>Choose background type:</p>
            <div class="button-group">
                <button class="secondary" id="exportSolidBtn">Solid BG</button>
                <button class="primary" id="exportTransparentBtn">Transparent</button>
            </div>
            <br>
            <button class="secondary" id="cancelExportBtn" style="width: 100%;">Cancel</button>
        </div>
    </div>

    <div id="shareModal" class="export-modal hidden">
        <div class="export-modal-content">
            <h2>Share Your Art</h2>
            <p>Link copied to clipboard!</p>
            <div class="share-notice">Anyone with this link can view and edit your pixel art</div>
            <br>
            <button class="primary" id="closeShareBtn" style="width: 100%;">Close</button>
        </div>
    </div>

    <script>
        class PixelArtCanvas {
            constructor() {
                this.canvas = document.getElementById('drawingCanvas');
                this.ctx = this.canvas.getContext('2d', { willReadFrequently: true });

                this.sizeOptions = [16, 20, 24, 32, 40];
                this.gridWidth = 24;
                this.gridHeight = 24;
                this.cellSize = 8;

                this.isDrawing = false;
                this.showGrid = true;
                this.aspectLocked = true;
                this.previewMode = false;
                this.currentColor = '#000000';
                this.controlsVisible = true;
                this.shouldEnterPreviewMode = false;

                this.strokes = [];
                this.currentStroke = null;
                this.pixelArtData = null;

                this.colors = [
                    '#000000', '#FFFFFF', '#FF0000', '#8B0000',
                    '#FFA500', '#FFFF00', '#00FF00', '#006400',
                    '#00FFFF', '#0000FF', '#00008B', '#800080',
                    '#FF00FF', '#FFC0CB', '#8B4513', '#808080'
                ];

                this.init();
            }

            init() {
                this.loadFromURL();
                this.setupCanvas();
                this.setupEventListeners();
                this.renderColorPalette();
                this.updateCurrentColor();
                this.render();

                if (this.shouldEnterPreviewMode) {
                    this.enterPreviewMode();
                }
            }

            loadFromURL() {
                const params = new URLSearchParams(window.location.search);
                const data = params.get('d');
                if (data) {
                    this.decodePixelArt(data);
                }
            }

            decodePixelArt(encoded) {
                try {
                    const parts = encoded.split('_');
                    if (parts.length !== 3) return;

                    const width = parseInt(parts[0]);
                    const height = parseInt(parts[1]);
                    const pixels = parts[2];

                    if (width > 40 || height > 40) return;

                    this.gridWidth = width;
                    this.gridHeight = height;

                    const widthIndex = this.sizeOptions.indexOf(width);
                    const heightIndex = this.sizeOptions.indexOf(height);
                    if (widthIndex !== -1) {
                        document.getElementById('widthSlider').value = widthIndex;
                        document.getElementById('widthValue').textContent = width;
                    }
                    if (heightIndex !== -1) {
                        document.getElementById('heightSlider').value = heightIndex;
                        document.getElementById('heightValue').textContent = height;
                    }

                    this.pixelArtData = [];
                    let index = 0;

                    for (let y = 0; y < height; y++) {
                        for (let x = 0; x < width; x++) {
                            if (index >= pixels.length) break;

                            const char = pixels[index++];
                            if (char === 'X') continue;

                            let colorIndex;
                            if (char >= '0' && char <= '9') {
                                colorIndex = parseInt(char);
                            } else if (char >= 'A' && char <= 'F') {
                                colorIndex = 10 + (char.charCodeAt(0) - 'A'.charCodeAt(0));
                            } else {
                                continue;
                            }

                            if (colorIndex < this.colors.length) {
                                this.pixelArtData.push({
                                    x: x,
                                    y: y,
                                    color: this.colors[colorIndex]
                                });
                            }
                        }
                    }

                    if (this.pixelArtData.length > 0) {
                        this.shouldEnterPreviewMode = true;
                    }
                } catch (e) {
                    console.error('Failed to decode pixel art:', e);
                }
            }

            encodePixelArt() {
                if (!this.pixelArtData) return null;

                const grid = Array(this.gridHeight).fill(null).map(() =>
                    Array(this.gridWidth).fill('X')
                );

                this.pixelArtData.forEach(pixel => {
                    const colorIndex = this.colors.indexOf(pixel.color);
                    if (colorIndex === -1) return;

                    let char;
                    if (colorIndex <= 9) {
                        char = colorIndex.toString();
                    } else if (colorIndex <= 15) {
                        char = String.fromCharCode('A'.charCodeAt(0) + (colorIndex - 10));
                    } else {
                        char = 'X';
                    }

                    if (pixel.y < this.gridHeight && pixel.x < this.gridWidth) {
                        grid[pixel.y][pixel.x] = char;
                    }
                });

                const pixels = grid.map(row => row.join('')).join('');
                return `${this.gridWidth}_${this.gridHeight}_${pixels}`;
            }

            sharePixelArt() {
                const encoded = this.encodePixelArt();
                if (!encoded) return;

                const url = new URL(window.location.href);
                url.search = `?d=${encoded}`;
                const shareURL = url.toString();

                navigator.clipboard.writeText(shareURL).then(() => {
                    document.getElementById('shareModal').classList.remove('hidden');
                }).catch(err => {
                    alert('Failed to copy link. Please copy manually: ' + shareURL);
                });
            }

            setupCanvas() {
                const maxWidth = window.innerWidth - 50;
                const maxHeight = window.innerHeight - 50;

                const cellWidth = Math.floor(maxWidth / this.gridWidth);
                const cellHeight = Math.floor(maxHeight / this.gridHeight);
                this.cellSize = Math.max(4, Math.min(cellWidth, cellHeight, 25));

                this.canvas.width = this.gridWidth * this.cellSize;
                this.canvas.height = this.gridHeight * this.cellSize;

                this.render();
            }

            setupEventListeners() {
                document.getElementById('floatingToggle').addEventListener('click', () => {
                    this.showControls();
                });

                document.getElementById('closeBtn').addEventListener('click', () => {
                    this.hideControls();
                });

                this.canvas.addEventListener('mousedown', (e) => this.startDrawing(e));
                this.canvas.addEventListener('mousemove', (e) => this.draw(e));
                this.canvas.addEventListener('mouseup', () => this.stopDrawing());
                this.canvas.addEventListener('mouseleave', () => this.stopDrawing());

                this.canvas.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    this.startDrawing(e.touches[0]);
                });
                this.canvas.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    this.draw(e.touches[0]);
                });
                this.canvas.addEventListener('touchend', () => this.stopDrawing());

                document.getElementById('widthSlider').addEventListener('input', (e) => {
                    this.updateWidth(e.target.value);
                });
                document.getElementById('heightSlider').addEventListener('input', (e) => {
                    this.updateHeight(e.target.value);
                });
                document.getElementById('aspectLock').addEventListener('change', (e) => {
                    this.aspectLocked = e.target.checked;
                });
                document.getElementById('gridToggle').addEventListener('change', (e) => {
                    this.showGrid = e.target.checked;
                    this.render();
                });

                document.getElementById('clearBtn').addEventListener('click', () => this.clearCanvas());
                document.getElementById('convertBtn').addEventListener('click', () => this.convertToPixelArt());
                document.getElementById('backBtn').addEventListener('click', () => this.backToDrawing());
                document.getElementById('exportBtn').addEventListener('click', () => this.showExportModal());
                document.getElementById('shareBtn').addEventListener('click', () => this.sharePixelArt());

                document.getElementById('exportSolidBtn').addEventListener('click', () => this.exportImage(false));
                document.getElementById('exportTransparentBtn').addEventListener('click', () => this.exportImage(true));
                document.getElementById('cancelExportBtn').addEventListener('click', () => this.hideExportModal());

                document.getElementById('closeShareBtn').addEventListener('click', () => {
                    document.getElementById('shareModal').classList.add('hidden');
                });

                window.addEventListener('resize', () => this.setupCanvas());
            }

            showControls() {
                this.controlsVisible = true;
                document.getElementById('controlsPanel').classList.remove('hidden');
                document.getElementById('floatingToggle').classList.add('hidden');
            }

            hideControls() {
                this.controlsVisible = false;
                document.getElementById('controlsPanel').classList.add('hidden');
                document.getElementById('floatingToggle').classList.remove('hidden');
            }

            renderColorPalette() {
                const palette = document.getElementById('colorPalette');
                palette.innerHTML = '';

                this.colors.forEach(color => {
                    const swatch = document.createElement('div');
                    swatch.className = 'color-swatch';
                    swatch.style.backgroundColor = color;
                    if (color === this.currentColor) {
                        swatch.classList.add('selected');
                    }
                    swatch.addEventListener('click', () => this.selectColor(color));
                    palette.appendChild(swatch);
                });
            }

            selectColor(color) {
                this.currentColor = color;
                this.renderColorPalette();
                this.updateCurrentColor();
            }

            updateCurrentColor() {
                document.getElementById('currentColorBox').style.backgroundColor = this.currentColor;
            }

            updateWidth(index) {
                const oldWidth = this.gridWidth;
                this.gridWidth = this.sizeOptions[index];
                document.getElementById('widthValue').textContent = this.gridWidth;

                if (this.aspectLocked) {
                    const ratio = this.gridWidth / oldWidth;
                    const newHeight = Math.round(this.gridHeight * ratio);
                    const newHeightIndex = this.sizeOptions.findIndex(s => s >= newHeight);
                    if (newHeightIndex !== -1) {
                        this.gridHeight = this.sizeOptions[newHeightIndex];
                        document.getElementById('heightSlider').value = newHeightIndex;
                        document.getElementById('heightValue').textContent = this.gridHeight;
                    }
                }

                this.setupCanvas();
            }

            updateHeight(index) {
                const oldHeight = this.gridHeight;
                this.gridHeight = this.sizeOptions[index];
                document.getElementById('heightValue').textContent = this.gridHeight;

                if (this.aspectLocked) {
                    const ratio = this.gridHeight / oldHeight;
                    const newWidth = Math.round(this.gridWidth * ratio);
                    const newWidthIndex = this.sizeOptions.findIndex(s => s >= newWidth);
                    if (newWidthIndex !== -1) {
                        this.gridWidth = this.sizeOptions[newWidthIndex];
                        document.getElementById('widthSlider').value = newWidthIndex;
                        document.getElementById('widthValue').textContent = this.gridWidth;
                    }
                }

                this.setupCanvas();
            }

            getCanvasCoords(e) {
                const rect = this.canvas.getBoundingClientRect();
                const scaleX = this.canvas.width / rect.width;
                const scaleY = this.canvas.height / rect.height;

                return {
                    x: (e.clientX - rect.left) * scaleX,
                    y: (e.clientY - rect.top) * scaleY
                };
            }

            startDrawing(e) {
                if (this.previewMode) return;

                this.isDrawing = true;
                const coords = this.getCanvasCoords(e);

                this.currentStroke = {
                    color: this.currentColor,
                    points: [coords]
                };
            }

            draw(e) {
                if (!this.isDrawing || this.previewMode) return;

                const coords = this.getCanvasCoords(e);
                this.currentStroke.points.push(coords);

                this.render();
            }

            stopDrawing() {
                if (!this.isDrawing) return;

                if (this.currentStroke && this.currentStroke.points.length > 0) {
                    this.strokes.push(this.currentStroke);
                }

                this.currentStroke = null;
                this.isDrawing = false;
                this.render();
            }

            clearCanvas() {
                if (confirm('Are you sure you want to clear the canvas?')) {
                    this.strokes = [];
                    this.currentStroke = null;
                    this.render();
                }
            }

            render() {
                this.ctx.fillStyle = '#F5F5F0';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                if (this.previewMode && this.pixelArtData) {
                    this.renderPixelArt();
                } else {
                    this.renderStrokes();
                    if (this.showGrid) {
                        this.renderGrid();
                    }
                }
            }

            renderStrokes() {
                this.ctx.lineCap = 'round';
                this.ctx.lineJoin = 'round';
                this.ctx.lineWidth = Math.max(6, this.cellSize * 0.5);

                this.strokes.forEach(stroke => {
                    if (stroke.points.length < 2) return;

                    this.ctx.strokeStyle = stroke.color;
                    this.ctx.beginPath();
                    this.ctx.moveTo(stroke.points[0].x, stroke.points[0].y);

                    for (let i = 1; i < stroke.points.length; i++) {
                        this.ctx.lineTo(stroke.points[i].x, stroke.points[i].y);
                    }

                    this.ctx.stroke();
                });

                if (this.currentStroke && this.currentStroke.points.length > 1) {
                    this.ctx.strokeStyle = this.currentStroke.color;
                    this.ctx.beginPath();
                    this.ctx.moveTo(this.currentStroke.points[0].x, this.currentStroke.points[0].y);

                    for (let i = 1; i < this.currentStroke.points.length; i++) {
                        this.ctx.lineTo(this.currentStroke.points[i].x, this.currentStroke.points[i].y);
                    }

                    this.ctx.stroke();
                }
            }

            renderGrid() {
                this.ctx.strokeStyle = 'rgba(0, 0, 0, 0.15)';
                this.ctx.lineWidth = 1;

                for (let x = 0; x <= this.gridWidth; x++) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(x * this.cellSize, 0);
                    this.ctx.lineTo(x * this.cellSize, this.canvas.height);
                    this.ctx.stroke();
                }

                for (let y = 0; y <= this.gridHeight; y++) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(0, y * this.cellSize);
                    this.ctx.lineTo(this.canvas.width, y * this.cellSize);
                    this.ctx.stroke();
                }
            }

            convertToPixelArt() {
                const imageData = this.ctx.getImageData(0, 0, this.canvas.width, this.canvas.height);
                const data = imageData.data;

                this.pixelArtData = [];

                for (let gy = 0; gy < this.gridHeight; gy++) {
                    for (let gx = 0; gx < this.gridWidth; gx++) {
                        const cellColors = {};
                        let hasColor = false;

                        for (let cy = 0; cy < this.cellSize; cy++) {
                            for (let cx = 0; cx < this.cellSize; cx++) {
                                const px = gx * this.cellSize + cx;
                                const py = gy * this.cellSize + cy;

                                if (px >= this.canvas.width || py >= this.canvas.height) continue;

                                const i = (py * this.canvas.width + px) * 4;
                                const r = data[i];
                                const g = data[i + 1];
                                const b = data[i + 2];

                                if (r === 245 && g === 245 && b === 240) continue;

                                const colorKey = `${r},${g},${b}`;
                                cellColors[colorKey] = (cellColors[colorKey] || 0) + 1;
                                hasColor = true;
                            }
                        }

                        if (hasColor) {
                            let maxCount = 0;
                            let dominantColor = null;

                            for (const [colorKey, count] of Object.entries(cellColors)) {
                                if (count > maxCount) {
                                    maxCount = count;
                                    dominantColor = colorKey;
                                }
                            }

                            if (dominantColor) {
                                const [r, g, b] = dominantColor.split(',').map(Number);
                                this.pixelArtData.push({
                                    x: gx,
                                    y: gy,
                                    color: `rgb(${r}, ${g}, ${b})`
                                });
                            }
                        }
                    }
                }

                this.enterPreviewMode();
            }

            renderPixelArt() {
                this.ctx.fillStyle = '#F5F5F0';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                this.pixelArtData.forEach(pixel => {
                    this.ctx.fillStyle = pixel.color;
                    this.ctx.fillRect(
                        pixel.x * this.cellSize,
                        pixel.y * this.cellSize,
                        this.cellSize,
                        this.cellSize
                    );
                });
            }

            enterPreviewMode() {
                this.previewMode = true;

                document.getElementById('sizeSection').classList.add('hidden');
                document.getElementById('colorSection').classList.add('hidden');
                document.getElementById('actionsSection').classList.add('hidden');
                document.getElementById('previewActions').classList.remove('hidden');

                this.render();
            }

            backToDrawing() {
                this.previewMode = false;

                document.getElementById('sizeSection').classList.remove('hidden');
                document.getElementById('colorSection').classList.remove('hidden');
                document.getElementById('actionsSection').classList.remove('hidden');
                document.getElementById('previewActions').classList.add('hidden');

                this.render();
            }

            showExportModal() {
                document.getElementById('exportModal').classList.remove('hidden');
            }

            hideExportModal() {
                document.getElementById('exportModal').classList.add('hidden');
            }

            exportImage(transparent) {
                const exportCanvas = document.createElement('canvas');
                exportCanvas.width = this.gridWidth;
                exportCanvas.height = this.gridHeight;
                const exportCtx = exportCanvas.getContext('2d');

                if (!transparent) {
                    exportCtx.fillStyle = '#F5F5F0';
                    exportCtx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);
                }

                this.pixelArtData.forEach(pixel => {
                    exportCtx.fillStyle = pixel.color;
                    exportCtx.fillRect(pixel.x, pixel.y, 1, 1);
                });

                const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, -5);
                const filename = `pixel-art-${timestamp}.png`;

                exportCanvas.toBlob(blob => {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = filename;
                    a.click();
                    URL.revokeObjectURL(url);
                });

                this.hideExportModal();
            }
        }

        const app = new PixelArtCanvas();
    </script>
</body>
</html>
