<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Army Defense</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #1a1a1a;
            color: #00ff00;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }

        #gameContainer {
            max-width: 100vw;
            max-height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 10px;
        }

        #gameCanvas {
            border: 4px solid #00ff00;
            background: #2a3a2a;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
            cursor: crosshair;
            image-rendering: pixelated;
        }

        #ui {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .panel {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #00ff00;
            padding: 10px;
            flex: 1;
            min-width: 200px;
        }

        .stats {
            display: flex;
            flex-direction: column;
            gap: 5px;
            font-size: 14px;
            text-shadow: 0 0 5px #00ff00;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
        }

        .stat-label {
            color: #00aa00;
        }

        .stat-value {
            color: #00ff00;
            font-weight: bold;
        }

        .towers-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .tower-btn {
            background: linear-gradient(180deg, #003300 0%, #001100 100%);
            border: 2px solid #00aa00;
            color: #00ff00;
            padding: 10px;
            cursor: pointer;
            transition: all 0.1s;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            text-align: left;
            position: relative;
        }

        .tower-btn:hover {
            border-color: #00ff00;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }

        .tower-btn:active {
            transform: scale(0.98);
        }

        .tower-btn.selected {
            background: linear-gradient(180deg, #005500 0%, #003300 100%);
            border-color: #00ff00;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.8);
        }

        .tower-btn.disabled {
            opacity: 0.4;
            cursor: not-allowed;
            border-color: #004400;
        }

        .tower-name {
            font-weight: bold;
            margin-bottom: 4px;
            font-size: 12px;
        }

        .tower-cost {
            color: #ffff00;
            font-size: 10px;
        }

        .tower-stats {
            font-size: 9px;
            color: #00aa00;
            margin-top: 2px;
        }

        .action-btns {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            flex: 1;
            background: #003300;
            border: 2px solid #00aa00;
            color: #00ff00;
            padding: 12px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            font-weight: bold;
            transition: all 0.1s;
        }

        .action-btn:hover {
            border-color: #00ff00;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        .action-btn.danger {
            border-color: #aa0000;
            color: #ff0000;
        }

        .action-btn.danger:hover {
            border-color: #ff0000;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
        }

        #message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            border: 4px solid #00ff00;
            padding: 30px;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            z-index: 1000;
            display: none;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.8);
            text-shadow: 0 0 10px #00ff00;
        }

        #message.show {
            display: block;
        }

        #message.victory {
            border-color: #00ff00;
            color: #00ff00;
        }

        #message.defeat {
            border-color: #ff0000;
            color: #ff0000;
            text-shadow: 0 0 10px #ff0000;
        }

        @media (max-width: 768px) {
            #gameContainer {
                padding: 5px;
                gap: 5px;
            }

            .panel {
                min-width: 150px;
                padding: 8px;
            }

            .stats {
                font-size: 12px;
            }

            .towers-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 5px;
            }

            .tower-btn {
                padding: 6px;
                font-size: 10px;
            }

            .action-btn {
                padding: 10px;
                font-size: 11px;
            }
        }

        @media (min-width: 1024px) {
            #ui {
                flex-direction: row;
            }

            .towers-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="ui">
            <div class="panel">
                <div class="stats">
                    <div class="stat-item">
                        <span class="stat-label">WAVE:</span>
                        <span class="stat-value" id="wave">1</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">HEALTH:</span>
                        <span class="stat-value" id="health">100</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">MONEY:</span>
                        <span class="stat-value" id="money">$200</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">KILLS:</span>
                        <span class="stat-value" id="kills">0</span>
                    </div>
                </div>
            </div>
            <div class="panel">
                <div class="towers-grid" id="towersGrid"></div>
            </div>
            <div class="panel">
                <div class="action-btns">
                    <button class="action-btn" id="startWaveBtn">START WAVE</button>
                    <button class="action-btn danger" id="sellBtn">SELL ($0)</button>
                </div>
            </div>
        </div>
    </div>

    <div id="message"></div>

    <script>
        class TowerDefenseGame {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.gridSize = 40;
                this.cols = 16;
                this.rows = 12;

                this.setupCanvas();

                this.towers = [];
                this.enemies = [];
                this.projectiles = [];
                this.explosions = [];

                this.selectedTowerType = null;
                this.selectedTower = null;
                this.hoveredCell = null;

                this.wave = 0;
                this.health = 100;
                this.money = 200;
                this.kills = 0;
                this.waveInProgress = false;
                this.enemiesSpawned = 0;
                this.enemiesToSpawn = 0;
                this.spawnTimer = 0;
                this.gameOver = false;

                this.path = this.generatePath();
                this.buildableZones = this.generateBuildableZones();

                this.towerTypes = {
                    machinegun: {
                        name: 'M.GUN',
                        cost: 50,
                        damage: 8,
                        range: 120,
                        fireRate: 15,
                        color: '#888888',
                        projectileSpeed: 8,
                        projectileColor: '#ffff00'
                    },
                    cannon: {
                        name: 'CANNON',
                        cost: 100,
                        damage: 30,
                        range: 140,
                        fireRate: 60,
                        color: '#8b4513',
                        projectileSpeed: 5,
                        projectileColor: '#ff4500',
                        splash: 40
                    },
                    missile: {
                        name: 'MISSILE',
                        cost: 150,
                        damage: 20,
                        range: 180,
                        fireRate: 40,
                        color: '#4169e1',
                        projectileSpeed: 4,
                        projectileColor: '#ff6347',
                        homing: true
                    },
                    sniper: {
                        name: 'SNIPER',
                        cost: 120,
                        damage: 50,
                        range: 220,
                        fireRate: 80,
                        color: '#2f4f2f',
                        projectileSpeed: 15,
                        projectileColor: '#00ffff'
                    }
                };

                this.enemyTypes = {
                    infantry: {
                        name: 'Infantry',
                        health: 30,
                        speed: 1.2,
                        color: '#228b22',
                        reward: 10,
                        size: 8
                    },
                    heavy: {
                        name: 'Heavy',
                        health: 60,
                        speed: 0.8,
                        color: '#006400',
                        reward: 20,
                        size: 10
                    },
                    jeep: {
                        name: 'Jeep',
                        health: 40,
                        speed: 2.0,
                        color: '#daa520',
                        reward: 15,
                        size: 12
                    },
                    tank: {
                        name: 'Tank',
                        health: 100,
                        speed: 0.6,
                        color: '#696969',
                        reward: 30,
                        size: 14
                    },
                    htank: {
                        name: 'H.Tank',
                        health: 200,
                        speed: 0.5,
                        color: '#2f4f4f',
                        reward: 50,
                        size: 16
                    }
                };

                this.init();
            }

            setupCanvas() {
                const maxWidth = Math.min(window.innerWidth - 20, 800);
                const maxHeight = Math.min(window.innerHeight - 200, 600);

                const cellWidth = Math.floor(maxWidth / this.cols);
                const cellHeight = Math.floor(maxHeight / this.rows);
                this.gridSize = Math.min(cellWidth, cellHeight);

                this.canvas.width = this.cols * this.gridSize;
                this.canvas.height = this.rows * this.gridSize;
            }

            generatePath() {
                return [
                    {x: -1, y: 6},
                    {x: 3, y: 6},
                    {x: 3, y: 3},
                    {x: 7, y: 3},
                    {x: 7, y: 8},
                    {x: 12, y: 8},
                    {x: 12, y: 5},
                    {x: 16, y: 5}
                ];
            }

            generateBuildableZones() {
                const zones = [];
                const pathSet = new Set(
                    this.path.slice(1, -1).map(p => `${p.x},${p.y}`)
                );

                for (let y = 0; y < this.rows; y++) {
                    for (let x = 0; x < this.cols; x++) {
                        if (!pathSet.has(`${x},${y}`)) {
                            const onPath = this.isOnPathLine(x, y);
                            if (!onPath) {
                                zones.push({x, y});
                            }
                        }
                    }
                }
                return zones;
            }

            isOnPathLine(x, y) {
                for (let i = 0; i < this.path.length - 1; i++) {
                    const p1 = this.path[i];
                    const p2 = this.path[i + 1];

                    if (p1.x === p2.x && p1.x === x) {
                        const minY = Math.min(p1.y, p2.y);
                        const maxY = Math.max(p1.y, p2.y);
                        if (y >= minY && y <= maxY) return true;
                    }

                    if (p1.y === p2.y && p1.y === y) {
                        const minX = Math.min(p1.x, p2.x);
                        const maxX = Math.max(p1.x, p2.x);
                        if (x >= minX && x <= maxX) return true;
                    }
                }
                return false;
            }

            init() {
                this.renderTowerButtons();
                this.setupEventListeners();
                this.gameLoop();
            }

            setupEventListeners() {
                this.canvas.addEventListener('click', (e) => this.handleCanvasClick(e));
                this.canvas.addEventListener('mousemove', (e) => this.handleMouseMove(e));
                this.canvas.addEventListener('touchstart', (e) => this.handleTouch(e));
                this.canvas.addEventListener('touchmove', (e) => this.handleTouchMove(e));

                document.getElementById('startWaveBtn').addEventListener('click', () => this.startWave());
                document.getElementById('sellBtn').addEventListener('click', () => this.sellTower());

                window.addEventListener('resize', () => this.setupCanvas());
            }

            handleCanvasClick(e) {
                if (this.gameOver) return;

                const rect = this.canvas.getBoundingClientRect();
                const x = Math.floor((e.clientX - rect.left) / this.gridSize);
                const y = Math.floor((e.clientY - rect.top) / this.gridSize);

                if (this.selectedTowerType) {
                    this.placeTower(x, y);
                } else {
                    this.selectTower(x, y);
                }
            }

            handleMouseMove(e) {
                const rect = this.canvas.getBoundingClientRect();
                const x = Math.floor((e.clientX - rect.left) / this.gridSize);
                const y = Math.floor((e.clientY - rect.top) / this.gridSize);
                this.hoveredCell = {x, y};
            }

            handleTouch(e) {
                e.preventDefault();
                if (this.gameOver) return;

                const rect = this.canvas.getBoundingClientRect();
                const touch = e.touches[0];
                const x = Math.floor((touch.clientX - rect.left) / this.gridSize);
                const y = Math.floor((touch.clientY - rect.top) / this.gridSize);

                if (this.selectedTowerType) {
                    this.placeTower(x, y);
                } else {
                    this.selectTower(x, y);
                }
            }

            handleTouchMove(e) {
                e.preventDefault();
                const rect = this.canvas.getBoundingClientRect();
                const touch = e.touches[0];
                const x = Math.floor((touch.clientX - rect.left) / this.gridSize);
                const y = Math.floor((touch.clientY - rect.top) / this.gridSize);
                this.hoveredCell = {x, y};
            }

            renderTowerButtons() {
                const grid = document.getElementById('towersGrid');
                grid.innerHTML = '';

                Object.keys(this.towerTypes).forEach(type => {
                    const tower = this.towerTypes[type];
                    const btn = document.createElement('button');
                    btn.className = 'tower-btn';
                    btn.innerHTML = `
                        <div class="tower-name">${tower.name}</div>
                        <div class="tower-cost">$${tower.cost}</div>
                        <div class="tower-stats">DMG:${tower.damage} RNG:${tower.range}</div>
                    `;
                    btn.addEventListener('click', () => this.selectTowerType(type, btn));
                    btn.dataset.type = type;
                    grid.appendChild(btn);
                });
            }

            selectTowerType(type, btn) {
                if (this.money < this.towerTypes[type].cost) return;

                document.querySelectorAll('.tower-btn').forEach(b => b.classList.remove('selected'));

                if (this.selectedTowerType === type) {
                    this.selectedTowerType = null;
                } else {
                    this.selectedTowerType = type;
                    btn.classList.add('selected');
                }

                this.selectedTower = null;
            }

            placeTower(x, y) {
                if (!this.selectedTowerType) return;

                const type = this.towerTypes[this.selectedTowerType];
                if (this.money < type.cost) return;

                const canBuild = this.buildableZones.some(z => z.x === x && z.y === y);
                if (!canBuild) return;

                const occupied = this.towers.some(t => t.gridX === x && t.gridY === y);
                if (occupied) return;

                this.towers.push({
                    gridX: x,
                    gridY: y,
                    x: x * this.gridSize + this.gridSize / 2,
                    y: y * this.gridSize + this.gridSize / 2,
                    type: this.selectedTowerType,
                    ...type,
                    cooldown: 0,
                    target: null,
                    angle: 0
                });

                this.money -= type.cost;
                this.selectedTowerType = null;
                document.querySelectorAll('.tower-btn').forEach(b => b.classList.remove('selected'));
                this.updateUI();
            }

            selectTower(x, y) {
                const tower = this.towers.find(t => t.gridX === x && t.gridY === y);
                this.selectedTower = tower || null;
                this.updateUI();
            }

            sellTower() {
                if (!this.selectedTower) return;

                const sellPrice = Math.floor(this.selectedTower.cost * 0.6);
                this.money += sellPrice;
                this.towers = this.towers.filter(t => t !== this.selectedTower);
                this.selectedTower = null;
                this.updateUI();
            }

            startWave() {
                if (this.waveInProgress || this.gameOver) return;

                this.wave++;
                this.waveInProgress = true;
                this.enemiesSpawned = 0;
                this.enemiesToSpawn = this.wave * 5 + 5;
                this.spawnTimer = 0;

                this.updateUI();
            }

            spawnEnemy() {
                const waveProgress = this.wave / 20;
                let type;
                const rand = Math.random();

                if (rand < 0.4) type = 'infantry';
                else if (rand < 0.65) type = 'heavy';
                else if (rand < 0.8) type = 'jeep';
                else if (rand < 0.92 || waveProgress < 0.3) type = 'tank';
                else type = 'htank';

                const enemyData = this.enemyTypes[type];
                const healthMultiplier = 1 + (this.wave - 1) * 0.15;

                this.enemies.push({
                    type,
                    ...enemyData,
                    health: enemyData.health * healthMultiplier,
                    maxHealth: enemyData.health * healthMultiplier,
                    pathIndex: 0,
                    progress: 0,
                    x: this.path[0].x * this.gridSize,
                    y: this.path[0].y * this.gridSize + this.gridSize / 2
                });
            }

            updateEnemies() {
                this.enemies.forEach(enemy => {
                    if (enemy.pathIndex >= this.path.length - 1) return;

                    const current = this.path[enemy.pathIndex];
                    const next = this.path[enemy.pathIndex + 1];

                    const dx = next.x - current.x;
                    const dy = next.y - current.y;
                    const distance = Math.sqrt(dx * dx + dy * dy) * this.gridSize;

                    enemy.progress += enemy.speed;

                    if (enemy.progress >= distance) {
                        enemy.progress = 0;
                        enemy.pathIndex++;
                    }

                    const t = enemy.progress / distance;
                    enemy.x = (current.x + dx * t) * this.gridSize + this.gridSize / 2;
                    enemy.y = (current.y + dy * t) * this.gridSize + this.gridSize / 2;
                });

                // Remove enemies that reached the end
                const escaped = this.enemies.filter(e => e.pathIndex >= this.path.length - 1);
                escaped.forEach(enemy => {
                    this.health -= 10;
                    if (this.health <= 0) {
                        this.health = 0;
                        this.endGame(false);
                    }
                });

                this.enemies = this.enemies.filter(e => e.pathIndex < this.path.length - 1);

                // Remove dead enemies
                const dead = this.enemies.filter(e => e.health <= 0);
                dead.forEach(enemy => {
                    this.money += enemy.reward;
                    this.kills++;
                    this.explosions.push({
                        x: enemy.x,
                        y: enemy.y,
                        radius: 0,
                        maxRadius: enemy.size * 2,
                        alpha: 1
                    });
                });

                this.enemies = this.enemies.filter(e => e.health > 0);
            }

            updateTowers() {
                this.towers.forEach(tower => {
                    if (tower.cooldown > 0) {
                        tower.cooldown--;
                    }

                    // Find target
                    if (!tower.target || tower.target.health <= 0) {
                        tower.target = null;

                        for (const enemy of this.enemies) {
                            const dx = enemy.x - tower.x;
                            const dy = enemy.y - tower.y;
                            const dist = Math.sqrt(dx * dx + dy * dy);

                            if (dist <= tower.range) {
                                tower.target = enemy;
                                break;
                            }
                        }
                    }

                    // Update angle to target
                    if (tower.target) {
                        const dx = tower.target.x - tower.x;
                        const dy = tower.target.y - tower.y;
                        tower.angle = Math.atan2(dy, dx);

                        // Check if still in range
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist > tower.range) {
                            tower.target = null;
                        }
                    }

                    // Fire
                    if (tower.target && tower.cooldown === 0) {
                        this.projectiles.push({
                            x: tower.x,
                            y: tower.y,
                            targetX: tower.target.x,
                            targetY: tower.target.y,
                            target: tower.homing ? tower.target : null,
                            speed: tower.projectileSpeed,
                            damage: tower.damage,
                            color: tower.projectileColor,
                            splash: tower.splash || 0,
                            angle: tower.angle
                        });

                        tower.cooldown = tower.fireRate;
                    }
                });
            }

            updateProjectiles() {
                this.projectiles.forEach(proj => {
                    let targetX = proj.targetX;
                    let targetY = proj.targetY;

                    if (proj.target && proj.target.health > 0) {
                        targetX = proj.target.x;
                        targetY = proj.target.y;
                    }

                    const dx = targetX - proj.x;
                    const dy = targetY - proj.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < proj.speed) {
                        proj.hit = true;

                        if (proj.splash > 0) {
                            // Splash damage
                            this.enemies.forEach(enemy => {
                                const edx = enemy.x - proj.x;
                                const edy = enemy.y - proj.y;
                                const edist = Math.sqrt(edx * edx + edy * edy);

                                if (edist <= proj.splash) {
                                    const dmgMultiplier = 1 - (edist / proj.splash) * 0.5;
                                    enemy.health -= proj.damage * dmgMultiplier;
                                }
                            });

                            this.explosions.push({
                                x: proj.x,
                                y: proj.y,
                                radius: 0,
                                maxRadius: proj.splash,
                                alpha: 1
                            });
                        } else {
                            // Single target
                            if (proj.target && proj.target.health > 0) {
                                proj.target.health -= proj.damage;
                            }
                        }
                    } else {
                        proj.x += (dx / dist) * proj.speed;
                        proj.y += (dy / dist) * proj.speed;
                    }
                });

                this.projectiles = this.projectiles.filter(p => !p.hit);
            }

            updateExplosions() {
                this.explosions.forEach(exp => {
                    exp.radius += 2;
                    exp.alpha -= 0.05;
                });

                this.explosions = this.explosions.filter(e => e.alpha > 0);
            }

            update() {
                if (this.gameOver) return;

                // Spawn enemies
                if (this.waveInProgress && this.enemiesSpawned < this.enemiesToSpawn) {
                    this.spawnTimer++;
                    if (this.spawnTimer >= 40) {
                        this.spawnEnemy();
                        this.enemiesSpawned++;
                        this.spawnTimer = 0;
                    }
                }

                // Check if wave is complete
                if (this.waveInProgress &&
                    this.enemiesSpawned >= this.enemiesToSpawn &&
                    this.enemies.length === 0) {
                    this.waveInProgress = false;
                    this.money += 50 + this.wave * 10;

                    if (this.wave >= 20) {
                        this.endGame(true);
                    }
                }

                this.updateEnemies();
                this.updateTowers();
                this.updateProjectiles();
                this.updateExplosions();
                this.updateUI();
            }

            draw() {
                this.ctx.fillStyle = '#2a3a2a';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                // Draw grid
                this.ctx.strokeStyle = 'rgba(0, 255, 0, 0.1)';
                this.ctx.lineWidth = 1;
                for (let x = 0; x <= this.cols; x++) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(x * this.gridSize, 0);
                    this.ctx.lineTo(x * this.gridSize, this.canvas.height);
                    this.ctx.stroke();
                }
                for (let y = 0; y <= this.rows; y++) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(0, y * this.gridSize);
                    this.ctx.lineTo(this.canvas.width, y * this.gridSize);
                    this.ctx.stroke();
                }

                // Draw path
                this.ctx.strokeStyle = '#654321';
                this.ctx.lineWidth = this.gridSize * 0.8;
                this.ctx.lineCap = 'square';
                this.ctx.beginPath();
                this.path.forEach((point, i) => {
                    const x = point.x * this.gridSize + this.gridSize / 2;
                    const y = point.y * this.gridSize + this.gridSize / 2;
                    if (i === 0) {
                        this.ctx.moveTo(x, y);
                    } else {
                        this.ctx.lineTo(x, y);
                    }
                });
                this.ctx.stroke();

                // Draw buildable zones highlight
                if (this.selectedTowerType && this.hoveredCell) {
                    const canBuild = this.buildableZones.some(
                        z => z.x === this.hoveredCell.x && z.y === this.hoveredCell.y
                    );
                    const occupied = this.towers.some(
                        t => t.gridX === this.hoveredCell.x && t.gridY === this.hoveredCell.y
                    );

                    if (canBuild && !occupied) {
                        this.ctx.fillStyle = 'rgba(0, 255, 0, 0.2)';
                    } else {
                        this.ctx.fillStyle = 'rgba(255, 0, 0, 0.2)';
                    }

                    this.ctx.fillRect(
                        this.hoveredCell.x * this.gridSize,
                        this.hoveredCell.y * this.gridSize,
                        this.gridSize,
                        this.gridSize
                    );
                }

                // Draw towers
                this.towers.forEach(tower => {
                    // Tower base
                    this.ctx.fillStyle = tower.color;
                    this.ctx.fillRect(
                        tower.x - this.gridSize * 0.3,
                        tower.y - this.gridSize * 0.3,
                        this.gridSize * 0.6,
                        this.gridSize * 0.6
                    );

                    // Tower barrel
                    this.ctx.save();
                    this.ctx.translate(tower.x, tower.y);
                    this.ctx.rotate(tower.angle);
                    this.ctx.fillStyle = '#444';
                    this.ctx.fillRect(0, -this.gridSize * 0.1, this.gridSize * 0.4, this.gridSize * 0.2);
                    this.ctx.restore();

                    // Range indicator for selected tower
                    if (tower === this.selectedTower) {
                        this.ctx.strokeStyle = 'rgba(255, 255, 0, 0.3)';
                        this.ctx.lineWidth = 2;
                        this.ctx.beginPath();
                        this.ctx.arc(tower.x, tower.y, tower.range, 0, Math.PI * 2);
                        this.ctx.stroke();
                    }
                });

                // Draw enemies
                this.enemies.forEach(enemy => {
                    // Enemy body
                    this.ctx.fillStyle = enemy.color;
                    this.ctx.fillRect(
                        enemy.x - enemy.size / 2,
                        enemy.y - enemy.size / 2,
                        enemy.size,
                        enemy.size
                    );

                    // Health bar
                    const healthPercent = enemy.health / enemy.maxHealth;
                    this.ctx.fillStyle = 'rgba(255, 0, 0, 0.5)';
                    this.ctx.fillRect(
                        enemy.x - enemy.size / 2,
                        enemy.y - enemy.size / 2 - 6,
                        enemy.size,
                        3
                    );
                    this.ctx.fillStyle = healthPercent > 0.3 ? '#00ff00' : '#ff0000';
                    this.ctx.fillRect(
                        enemy.x - enemy.size / 2,
                        enemy.y - enemy.size / 2 - 6,
                        enemy.size * healthPercent,
                        3
                    );
                });

                // Draw projectiles
                this.projectiles.forEach(proj => {
                    this.ctx.fillStyle = proj.color;
                    this.ctx.beginPath();
                    this.ctx.arc(proj.x, proj.y, 3, 0, Math.PI * 2);
                    this.ctx.fill();
                });

                // Draw explosions
                this.explosions.forEach(exp => {
                    this.ctx.strokeStyle = `rgba(255, 100, 0, ${exp.alpha})`;
                    this.ctx.lineWidth = 3;
                    this.ctx.beginPath();
                    this.ctx.arc(exp.x, exp.y, exp.radius, 0, Math.PI * 2);
                    this.ctx.stroke();
                });
            }

            updateUI() {
                document.getElementById('wave').textContent = this.wave;
                document.getElementById('health').textContent = this.health;
                document.getElementById('money').textContent = '$' + this.money;
                document.getElementById('kills').textContent = this.kills;

                const startBtn = document.getElementById('startWaveBtn');
                startBtn.disabled = this.waveInProgress;
                startBtn.textContent = this.waveInProgress ? 'WAVE ' + this.wave : 'START WAVE';

                const sellBtn = document.getElementById('sellBtn');
                if (this.selectedTower) {
                    const sellPrice = Math.floor(this.selectedTower.cost * 0.6);
                    sellBtn.textContent = `SELL ($${sellPrice})`;
                    sellBtn.disabled = false;
                } else {
                    sellBtn.textContent = 'SELL ($0)';
                    sellBtn.disabled = true;
                }

                // Update tower buttons
                document.querySelectorAll('.tower-btn').forEach(btn => {
                    const type = btn.dataset.type;
                    const tower = this.towerTypes[type];
                    if (this.money < tower.cost) {
                        btn.classList.add('disabled');
                    } else {
                        btn.classList.remove('disabled');
                    }
                });
            }

            showMessage(text, type) {
                const msg = document.getElementById('message');
                msg.textContent = text;
                msg.className = 'show ' + type;
            }

            endGame(victory) {
                this.gameOver = true;
                if (victory) {
                    this.showMessage('VICTORY!\nBASE DEFENDED!', 'victory');
                } else {
                    this.showMessage('DEFEAT!\nBASE DESTROYED!', 'defeat');
                }

                setTimeout(() => {
                    if (confirm('Play again?')) {
                        location.reload();
                    }
                }, 2000);
            }

            gameLoop() {
                this.update();
                this.draw();
                requestAnimationFrame(() => this.gameLoop());
            }
        }

        // Start the game
        const game = new TowerDefenseGame();
    </script>
</body>
</html>
